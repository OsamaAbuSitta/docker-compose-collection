version: "3.9"

services:
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    ports:
      - "${ARCHIVEBOX_PORT:-8000}:8000"
    environment:
      - ALLOWED_HOSTS=*
      - MEDIA_MAX_SIZE=750m
      - TZ=${TZ:-UTC}
    volumes:
      - archivebox-data:/data
    command: server --quick-init 0.0.0.0:8000

networks:
  default:
    name: archivebox-network

volumes:
  archivebox-data:
