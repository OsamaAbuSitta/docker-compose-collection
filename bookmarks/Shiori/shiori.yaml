version: "3.9"

services:
  shiori:
    image: ghcr.io/go-shiori/shiori:latest
    container_name: shiori
    restart: unless-stopped
    ports:
      - "${SHIORI_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - shiori-data:/shiori

networks:
  default:
    name: shiori-network

volumes:
  shiori-data:
