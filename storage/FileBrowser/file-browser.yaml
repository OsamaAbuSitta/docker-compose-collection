version: "3.9"

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8080}:80"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${FILES_DIR:-./files}:/srv
      - filebrowser-db:/database
      - filebrowser-config:/config

networks:
  default:
    name: filebrowser-network

volumes:
  filebrowser-db:
  filebrowser-config:
