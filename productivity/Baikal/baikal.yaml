version: "3.9"

services:
  baikal:
    image: ckulka/baikal:latest
    container_name: baikal
    restart: unless-stopped
    ports:
      - "${BAIKAL_PORT:-80}:80"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific

networks:
  default:
    name: baikal-network

volumes:
  baikal-config:
  baikal-data:
