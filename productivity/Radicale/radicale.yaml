version: "3.9"

services:
  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    ports:
      - "${RADICALE_PORT:-5232}:5232"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - radicale-data:/data

networks:
  default:
    name: radicale-network

volumes:
  radicale-data:
