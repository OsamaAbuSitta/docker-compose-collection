version: "3.2"
services:

  sql-server-db:
    container_name: sql-server-db
    image: mcr.microsoft.com/mssql/server
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "P@ssw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - ./mssqldata/data:/var/opt/mssql/data
      - ./mssqldata/log:/var/opt/mssql/log
      - ./mssqldata/secrets:/var/opt/mssql/secrets