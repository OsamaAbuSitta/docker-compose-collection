version: "3.9"

services:
  typesense:
    image: typesense/typesense:27.1
    container_name: typesense_container
    restart: unless-stopped
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-P@ss0rd123}
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=${TYPESENSE_ENABLE_CORS:-true}
      - TYPESENSE_API_ADDRESS=${TYPESENSE_API_ADDRESS:-0.0.0.0}
      - TYPESENSE_API_PORT=8108
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  typesense-data:

networks:
  default:
    name: typesense-network
