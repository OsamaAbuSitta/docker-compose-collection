version: "3.9"

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${WEB_PORT:-8025}:8025"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - mailpit-data:/data

networks:
  default:
    name: mailpit-network

volumes:
  mailpit-data:
