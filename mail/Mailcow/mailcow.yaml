version: "3.9"

services:
  mailcow-web:
    image: mailcow/mailcow-dockerized:latest
    container_name: mailcow
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSION_PORT:-587}:587"
      - "${SMTPS_PORT:-465}:465"
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
      - "${POP3_PORT:-110}:110"
      - "${POP3S_PORT:-995}:995"
    environment:
      - MAILCOW_HOSTNAME=${HOSTNAME:-mail.example.com}
      - TZ=${TZ:-UTC}
    volumes:
      - mailcow-data:/var/lib/mailcow

volumes:
  mailcow-data:
