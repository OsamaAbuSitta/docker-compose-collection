version: "3.9"

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab_container
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME:-gitlab.local}
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:80"
      - "${GITLAB_HTTPS_PORT:-8943}:443"
      - "${GITLAB_SSH_PORT:-2222}:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.local}'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:-P@ssw0rd@123}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'utf8'
        gitlab_rails['db_host'] = 'gitlab-postgres'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_database'] = '${POSTGRES_DB:-gitlabhq_production}'
        gitlab_rails['db_username'] = '${POSTGRES_USER:-gitlab}'
        gitlab_rails['db_password'] = '${POSTGRES_PASSWORD:-P@ssw0rd@123}'
        redis['enable'] = false
        gitlab_rails['redis_host'] = 'gitlab-redis'
        gitlab_rails['redis_port'] = 6379
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    depends_on:
      - gitlab-postgres
      - gitlab-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  gitlab-postgres:
    image: postgres:15-alpine
    container_name: gitlab_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gitlab}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-P@ssw0rd@123}
      - POSTGRES_DB=${POSTGRES_DB:-gitlabhq_production}
    volumes:
      - gitlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitlab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitlab-redis:
    image: redis:7-alpine
    container_name: gitlab_redis
    restart: unless-stopped
    volumes:
      - gitlab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  gitlab-postgres-data:
  gitlab-redis-data:

networks:
  default:
    name: gitlab-network
