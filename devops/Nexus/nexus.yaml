version: "3.9"

services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus_container
    restart: unless-stopped
    ports:
      - "${NEXUS_HTTP_PORT:-8081}:8081"
      - "${NEXUS_DOCKER_PORT:-8082}:8082"
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms${NEXUS_MIN_HEAP:-2703m} -Xmx${NEXUS_MAX_HEAP:-2703m} -XX:MaxDirectMemorySize=${NEXUS_MAX_DIRECT_MEMORY:-2703m}
      - NEXUS_CONTEXT=${NEXUS_CONTEXT:-/}
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  nexus-data:

networks:
  default:
    name: nexus-network
