version: "3.9"

services:
  grocy:
    image: linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    ports:
      - "9283:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - grocy-config:/config

volumes:
  grocy-config:

networks:
  default:
    name: grocy-network
