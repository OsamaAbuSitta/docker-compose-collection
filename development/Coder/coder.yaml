version: "3.9"

services:
  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    restart: unless-stopped
    ports:
      - "${CODER_PORT:-7080}:7080"
    environment:
      - CODER_PG_CONNECTION_URL=postgres://${POSTGRES_USER:-coder}:${POSTGRES_PASSWORD:-P@ss0rd123}@coder-db/${POSTGRES_DB:-coder}?sslmode=disable
      - CODER_HTTP_ADDRESS=0.0.0.0:7080
      - CODER_ACCESS_URL=${ACCESS_URL:-http://localhost:7080}
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - coder-db

  coder-db:
    image: postgres:15
    container_name: coder_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-coder}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-P@ss0rd123}
      - POSTGRES_DB=${POSTGRES_DB:-coder}
    volumes:
      - coder-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  coder-db-data:

networks:
  default:
    name: coder-network
