version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ollama-models:/root/.ollama

networks:
  default:
    name: ollama-network

volumes:
  ollama-models:
