version: "3.9"

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
      - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
      - ND_BASEURL=${ND_BASEURL:-}
      - TZ=${TZ:-UTC}
    volumes:
      - navidrome-data:/data
      - ${MUSIC_PATH:-./music}:/music:ro

volumes:
  navidrome-data:

networks:
  default:
    name: navidrome-network
