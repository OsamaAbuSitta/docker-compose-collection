name: Validate Docker Compose Files

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.yaml'
      - '**/*.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Validate Docker Compose files
      run: |
        echo "Validating Docker Compose files..."
        # Exclude .github directory and find compose files
        find . -path ./.github -prune -o -type f \( -name "*.yaml" -o -name "*.yml" \) -print | while read file; do
          # Check if it's a Docker Compose file
          if grep -q "services:" "$file" 2>/dev/null; then
            echo "Validating: $file"
            docker compose -f "$file" config > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "✅ Valid: $file"
            else
              echo "❌ Invalid: $file"
              echo "Error details:"
              docker compose -f "$file" config 2>&1 || true
              exit 1
            fi
          fi
        done
        echo "Validation complete!"
        
    - name: Check for security issues
      run: |
        echo "Checking for common security issues..."
        
        # Check for default passwords in compose files
        if grep -r "P@ssw0rd\|password123\|admin123" --include="*.yaml" --include="*.yml" .; then
          echo "⚠️ Warning: Default passwords found. Ensure these are documented as development-only."
        fi
        
        # Check for exposed sensitive ports
        if grep -r "ports:" --include="*.yaml" --include="*.yml" . | grep -E "3306|5432|27017|6379" | grep "0.0.0.0"; then
          echo "⚠️ Warning: Database ports exposed to all interfaces. Consider restricting to localhost."
        fi
