version: "3.9"

services:
  swagger-editor:
    image: swaggerapi/swagger-editor:latest
    container_name: swagger-editor
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${SPECS_DIR:-./specs}:/specs

networks:
  default:
    name: swagger-editor-network
