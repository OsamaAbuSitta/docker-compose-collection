version: "3.9"

services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    container_name: hoppscotch
    restart: unless-stopped
    ports:
      - "${HOPPSCOTCH_PORT:-3000}:3000"
    environment:
      - TZ=${TZ:-UTC}
      - PRODUCTION=${PRODUCTION:-false}
    volumes:
      - ${COLLECTIONS_DIR:-./collections}:/app/collections

networks:
  default:
    name: hoppscotch-network
