version: "3.9"

services:
  n8n-app:
    image: n8nio/n8n:latest
    container_name: n8n_app
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_INTERNAL_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_HOST:-n8n-db}
      - DB_POSTGRESDB_PORT=${DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_USERNAME:-n8n}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-P@ss0rd123}
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY:-changeme_32_character_secret_key}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${SAVE_ON_ERROR:-all}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${SAVE_ON_SUCCESS:-all}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${SAVE_MANUAL:-true}
      - N8N_METRICS=${METRICS_ENABLED:-false}
      - TZ=${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - n8n-db

  n8n-db:
    image: postgres:15
    container_name: n8n_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-P@ss0rd123}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data

volumes:
  n8n-data:
  n8n-db-data:

networks:
  default:
    name: n8n-network
